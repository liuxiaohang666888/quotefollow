name = "flat-term-8bf2"
main = "worker.js"
account_id = "629c3bf6e32c24bc00375435a50b56ec"
compatibility_date = "2024-09-23"
# 保留面板上已配置的变量/密钥，避免部署时被清掉
keep_vars = true

[vars]
# 必须用 www.voxalo.top！
# 无www的 voxalo.top 对 POST 返回 308 跳转到 www，
# Cloudflare Worker 的 fetch 跟随跨子域重定向时会剥掉 X-Inbound-Secret 头
# → 后端 401 拒收 → "客户回复为空/收不到" 的隐形杀手
BACKEND_URL = "https://www.voxalo.top/api/webhooks/inbound"
# ⚠️ INBOUND_SECRET 不再写在本文件里（曾以明文提交进 git，已泄露，必须轮换）。
# 正确配置方式（二选一，推荐 secret）：
#   1) wrangler secret put INBOUND_SECRET   （加密存储，不进仓库）
#   2) Cloudflare 面板 -> Workers -> flat-term-8bf2 -> Settings -> Variables 添加
# 注意：若面板里还留着旧的同名"普通文本变量"，wrangler secret put 会报 10053，
# 需先在面板删除该普通文本变量，再执行 secret put。
# 轮换后的新值必须与 Vercel 的 INBOUND_WEBHOOK_SECRET 完全一致。
